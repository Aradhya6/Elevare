<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevare - Engineering Placement Suite</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Phosphor Icons (Duotone for friendlier look) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono (For CS feel) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            /* Slate-100 for contrast with white glass */
            color: #1e293b;

            /* Tech Grid / Circuit Board Feel */
            background-image:
                /* Circuit Dots */
                radial-gradient(#cbd5e1 2px, transparent 2px),
                /* faint grid */
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);

            background-size: 30px 30px, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 0 0;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- UI UTILITIES --- */

        /* Glassmorphism Class - More Frosted, Visible Edges */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            /* Less transparent (more opaque) as requested */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        .glass-dark {
            background: #1e293b;
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            color: white;
        }

        /* Fun Interactions */
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-bouncy:active {
            transform: scale(0.95);
        }

        .btn-bouncy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.15);
        }

        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.01);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Animations */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes pulse-code {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .cursor-blink {
            animation: pulse-code 1s infinite;
        }

        @keyframes slide-in-top {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-slide-in {
            animation: slide-in-top 0.3s ease-out forwards;
        }


        /* Inputs */
        .fun-input {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            color: #334155;
        }

        .fun-input:focus {
            background: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        /* Terminal Window Style */
        .terminal-window {
            background: #0f172a;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid #1e293b;
        }

        .terminal-header {
            background: #020617;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ef4444;
        }

        .dot-yellow {
            background: #f59e0b;
        }

        .dot-green {
            background: #22c55e;
        }
    </style>
</head>

<body>

    <div id="app" class="min-h-screen flex flex-col relative overflow-hidden">
        <!-- Main Content Area -->
        <div class="relative z-10 flex-1 flex flex-col">
            <!-- Content rendered here by JS -->
        </div>
    </div>

    <script type="module">
        // --- Firebase Initialization and Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, where, getDocs, deleteDoc, updateDoc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION SECTION ---
        const appId = 'placement-c5426';

        const firebaseConfig = {
            apiKey: "AIzaSyBHqcAH2ZzXsLU4meyBOP7ZZ-BU_7tE_yo",
            authDomain: "placement-c5426.firebaseapp.com",
            projectId: "placement-c5426",
            storageBucket: "placement-c5426.firebasestorage.app",
            messagingSenderId: "1010196829466",
            appId: "1:1010196829466:web:17d785da730d9fbfec48a3",
            measurementId: "G-96J5LRNCTH"
        };

        const initialAuthToken = null;
        const API_KEY = "AIzaSyDHMRZPTh6BUIAHf6ZhOpmYtP0Tv2fyQHs";
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=`;

        // ------------------------------

        let app, db, auth;
        let currentUserId = null;
        let userRole = 'guest';
        let isAuthReady = false;

        const COLLECTION_STUDENTS = `artifacts/${appId}/public/data/students`;
        const COLLECTION_COMPANIES = `artifacts/${appId}/public/data/companies`;

        let state = {
            view: 'loading',
            message: '',
            isLoading: false,
            studentData: [],
            companyRequirements: [],
            loggedInUser: null,
            llmRecommendation: null,
            isGeneratingLLM: false,
            showMatchModal: false,
            showProfileModal: false, // New: For editing profile
            selectedCompanyMatches: [],
            selectedCompanyName: ''
        };

        // --- Utility Functions ---
        async function withExponentialBackoff(fn, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000 + Math.random() * 1000));
                }
            }
        }

        async function fetchGeminiResponse(prompt, systemInstruction) {
            if (!API_KEY) throw new Error("API Key Missing");
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
            };
            const fetchFn = async () => {
                const response = await fetch(GEMINI_API_URL + API_KEY, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`API Error`);
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
            };
            return withExponentialBackoff(fetchFn);
        }

        function parseCSV(csvText) {
            const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/"/g, '')));
            if (rows.length === 0) return [];
            const headers = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, '_'));
            const data = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length !== headers.length) continue;
                let rowObj = {};
                rows[i].forEach((cell, index) => {
                    let key = headers[index];
                    if (key === 'cgpa') rowObj['cgpa'] = parseFloat(cell) || 0;
                    else if (key.includes('skill')) rowObj['skills'] = cell.split(';').map(s => s.trim()).filter(s => s.length > 0);
                    else rowObj[key] = cell;
                });
                if (rowObj.usn) data.push(rowObj);
            }
            return data;
        }

        function findEligibleStudents(company, allStudents) {
            if (!company || !allStudents) return [];
            const requiredSkills = (company.required_skills || []).map(s => s.toLowerCase());
            const minCgpa = company.min_cgpa || 0;
            return allStudents.filter(student => {
                const studentCgpa = student.cgpa || 0;
                if (studentCgpa < minCgpa) return false;
                const studentSkills = new Set((student.skills || []).map(s => s.toLowerCase()));
                return requiredSkills.every(reqSkill => studentSkills.has(reqSkill));
            });
        }

        function findPlacementsForStudent(student, companies) {
            if (!student || !student.skills || !student.cgpa) return [];
            const studentSkills = new Set(student.skills.map(s => s.toLowerCase()));
            return companies.filter(company => {
                let cgpaMatch = student.cgpa >= (company.min_cgpa || 0);
                let skillMatch = true;
                if (company.required_skills && company.required_skills.length > 0) {
                    const requiredSkills = company.required_skills.map(s => s.toLowerCase());
                    skillMatch = requiredSkills.every(reqSkill => studentSkills.has(reqSkill));
                }
                return cgpaMatch && skillMatch;
            }).map(company => ({
                ...company,
                match_score: (company.min_cgpa && student.cgpa >= company.min_cgpa ? 50 : 0) +
                    (company.required_skills ? company.required_skills.length * 10 : 0)
            })).sort((a, b) => b.match_score - a.match_score);
        }

        async function generateRecommendation() {
            const student = state.loggedInUser;
            if (!student) return;
            updateState({ isGeneratingLLM: true, llmRecommendation: null, message: '💻 Running System Diagnostics...' });
            const prompt = `Student: ${student.name}, USN: ${student.usn}, Dept: ${student.dept}, CGPA: ${student.cgpa}, Skills: ${student.skills.join(', ')}. Analyze for a Software Engineering role.`;
            const systemInstruction = `You are a Senior Staff Engineer and Mentor. Provide a technical markdown response with 3 sections: "1. Core Stack Analysis (Strengths)", "2. Debugging Required (Weaknesses)", and "3. Deployment Strategy (Project Idea)". Use engineering terminology (latency, stack, deploy, commit, etc).`;
            try {
                const result = await fetchGeminiResponse(prompt, systemInstruction);
                updateState({ llmRecommendation: result, isGeneratingLLM: false });
            } catch (error) {
                updateState({ isGeneratingLLM: false, message: `Runtime Error: ${error.message}` });
            }
        }

        // --- Firebase Logic ---
        async function initializeAndAuthenticate() {
            if (Object.keys(firebaseConfig).length === 0) return;
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await setPersistence(auth, browserSessionPersistence);
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        isAuthReady = true;
                        if (state.view === 'loading') updateState({ view: 'login' });
                        setupRealtimeListeners();
                    } else {
                        currentUserId = null;
                        isAuthReady = true;
                        updateState({ view: 'login' });
                        signInAnonymously(auth);
                    }
                });
            } catch (error) { console.error(error); }
        }

        function setupRealtimeListeners() {
            if (!isAuthReady) return;
            onSnapshot(collection(db, COLLECTION_STUDENTS), (snapshot) => {
                const students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Update currently logged in user if data changes
                if (state.loggedInUser) {
                    const currentUserData = students.find(s => s.usn === state.loggedInUser.usn);
                    if (currentUserData) state.loggedInUser = currentUserData;
                }

                updateState({ studentData: students });
            });
            onSnapshot(collection(db, COLLECTION_COMPANIES), (snapshot) => {
                const companies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateState({ companyRequirements: companies });
            });
        }

        async function handleFileUpload(file) {
            if (!file) return;
            updateState({ isLoading: true, message: 'Parsing Stream...' });
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const parsedData = parseCSV(e.target.result);
                    let count = 0;
                    for (const student of parsedData) {
                        await setDoc(doc(db, COLLECTION_STUDENTS, student.usn), student, { merge: true });
                        count++;
                    }
                    updateState({ isLoading: false, message: `Success: Committed ${count} records.` });
                } catch (error) { updateState({ isLoading: false, message: `Exception: ${error.message}` }); }
            };
            reader.readAsText(file);
        }

        async function handleSaveCompany(name, min_cgpa, required_skills) {
            if (!name) return;
            updateState({ isLoading: true });
            try {
                const skillsArray = required_skills.split(',').map(s => s.trim()).filter(s => s.length > 0);
                const companyId = name.toLowerCase().replace(/\s/g, '_');
                await setDoc(doc(db, COLLECTION_COMPANIES, companyId), { name, min_cgpa: parseFloat(min_cgpa), required_skills: skillsArray });
                updateState({ isLoading: false, message: 'New Requirement Deployed ✅' });
            } catch (error) { updateState({ isLoading: false, message: error.message }); }
        }

        async function handleDeleteAllStudents() {
            if (!confirm("WARNING: Drop Table Students? This cannot be undone.")) return;
            updateState({ isLoading: true, message: 'Truncating table...' });
            const snapshot = await getDocs(collection(db, COLLECTION_STUDENTS));
            await Promise.all(snapshot.docs.map(doc => deleteDoc(doc.ref)));
            updateState({ isLoading: false, message: 'Database flushed.' });
        }

        async function handleDeleteItem(collectionPath, id) {
            if (!confirm("Delete this object?")) return;
            await deleteDoc(doc(db, collectionPath, id));
        }

        // New: Apply to Company
        async function handleApplyToCompany(companyId, companyName) {
            if (!state.loggedInUser) return;
            updateState({ isLoading: true });
            try {
                const application = {
                    companyId,
                    companyName,
                    status: 'Applied', // Applied, Interview, Offer, Rejected
                    timestamp: new Date().toISOString()
                };
                // Use arrayUnion to add to the applications array
                await updateDoc(doc(db, COLLECTION_STUDENTS, state.loggedInUser.usn), {
                    applications: arrayUnion(application)
                });
                updateState({ isLoading: false, message: `Application packet sent to ${companyName} 🚀` });
            } catch (error) {
                updateState({ isLoading: false, message: `Apply Error: ${error.message}` });
            }
        }

        // New: Update Profile
        async function handleUpdateProfile(github, linkedin) {
            if (!state.loggedInUser) return;
            updateState({ isLoading: true });
            try {
                await updateDoc(doc(db, COLLECTION_STUDENTS, state.loggedInUser.usn), {
                    github: github,
                    linkedin: linkedin
                });
                updateState({ isLoading: false, showProfileModal: false, message: 'Profile config updated.' });
            } catch (error) {
                updateState({ isLoading: false, message: `Update Error: ${error.message}` });
            }
        }


        function loginAsAdmin(email) {
            // Simple verification logic
            if (email && (email.toLowerCase() === 'aradhya3124@gmail.com' || email.toLowerCase().endsWith('@admin.edu'))) {
                userRole = 'admin';
                updateState({ view: 'admin', message: 'Root Access Granted ⚡' });
            } else {
                updateState({ message: '🚫 Access Denied. Using admin email' });
            }
        }

        async function loginAsStudent(usn) {
            updateState({ isLoading: true, message: 'Authenticating...' });
            try {
                const docSnap = await getDoc(doc(db, COLLECTION_STUDENTS, usn));
                if (docSnap.exists()) {
                    userRole = 'student';
                    updateState({ view: 'student', loggedInUser: docSnap.data(), isLoading: false, llmRecommendation: null, message: `Session Active: ${docSnap.data().name}` });
                } else {
                    updateState({ isLoading: false, message: '404: USN Not Found.' });
                }
            } catch (e) { updateState({ isLoading: false, message: 'Connection Timeout.' }); }
        }

        function viewAsStudent(usn) {
            const student = state.studentData.find(s => s.usn === usn);
            if (student) updateState({ view: 'student', loggedInUser: student, llmRecommendation: null, message: `Inspecting Object: ${student.name}` });
        }

        function handleSignOut() {
            userRole = 'guest';
            state.loggedInUser = null;
            updateState({ view: 'login', message: 'Session Terminated.' });
        }

        // --- RENDERERS ---

        function render() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = '';

            // Toast - MOVED down to top-24 to avoid navbar overlap, Removed animate-bounce, Added slide-in
            if (state.message) {
                const toast = document.createElement('div');
                toast.className = 'fixed top-24 right-6 glass text-slate-800 px-6 py-4 rounded-lg shadow-xl z-[60] text-sm font-bold flex items-center gap-3 border-l-4 border-indigo-500 font-mono animate-slide-in';
                toast.innerHTML = `<i class="ph-bold ph-terminal-window text-xl text-indigo-600"></i> <span>${state.message}</span>`;
                appDiv.appendChild(toast);
            }

            let content;
            if (state.view === 'loading') content = renderLoadingView();
            else if (state.view === 'login') content = renderLoginView();
            else if (state.view === 'admin') content = renderAdminView();
            else if (state.view === 'student') content = renderStudentView();

            appDiv.innerHTML += content;
            if (state.showMatchModal) appDiv.innerHTML += renderMatchModal();
            if (state.showProfileModal) appDiv.innerHTML += renderProfileModal();

            attachEventListeners();
        }

        function updateState(newState) {
            state = { ...state, ...newState };
            if (newState.message) setTimeout(() => updateState({ message: '' }), 4000);
            render();
        }

        function renderLoadingView() {
            return `
            <div class="h-screen flex items-center justify-center">
                <div class="text-center">
                    <div class="flex justify-center gap-2 mb-4">
                        <i class="ph-duotone ph-cpu text-6xl text-indigo-500 animate-spin"></i>
                    </div>
                    <h2 class="text-xl font-mono text-slate-700">System Booting...</h2>
                </div>
            </div>`;
        }

        function renderLoginView() {
            return `
            <div class="flex-1 flex items-center justify-center p-6 sm:p-12">
                <div class="glass w-full max-w-5xl min-h-[600px] rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 relative">
                    
                    <!-- Left: CS Vibes (Dark Mode IDE feel) - UPDATED -->
                    <div class="hidden md:flex flex-col justify-center p-12 relative overflow-hidden bg-slate-900 text-white border-r border-slate-800">
                        <!-- Grid overlay -->
                        <div class="absolute inset-0 opacity-20" style="background-image: linear-gradient(#4f46e5 1px, transparent 1px), linear-gradient(90deg, #4f46e5 1px, transparent 1px); background-size: 30px 30px;"></div>
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-900/90"></div>
                        
                        <!-- Floating Icons -->
                        <i class="ph-duotone ph-code absolute top-20 right-10 text-6xl text-cyan-400 opacity-80 animate-float font-mono"></i>
                        <i class="ph-duotone ph-git-branch absolute bottom-20 left-10 text-6xl text-purple-400 opacity-80 animate-float" style="animation-delay: 1s"></i>
                        <span class="absolute top-1/2 left-1/2 text-8xl text-white opacity-5 -translate-x-1/2 -translate-y-1/2 font-mono font-bold"> < / > </span>

                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-4">
                                <i class="ph-fill ph-circuitry text-4xl text-cyan-400"></i>
                                <h1 class="text-5xl font-extrabold tracking-tight">Elev<span class="text-cyan-400">are</span></h1>
                            </div>
                            <p class="text-slate-400 text-lg mb-8 leading-relaxed font-mono">Compile your future. Debug your career path. Deploy to production.</p>
                            <div class="flex gap-2">
                                <span class="bg-white/10 backdrop-blur-md px-3 py-1 rounded-md text-xs font-mono text-cyan-300 border border-cyan-500/30">v2.0.1 Stable</span>
                                <span class="bg-white/10 backdrop-blur-md px-3 py-1 rounded-md text-xs font-mono text-purple-300 border border-purple-500/30">Secure Shell</span>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Login Forms - UPDATED WITH GLASS EFFECT -->
                    <div class="p-10 flex flex-col justify-center bg-white/60 backdrop-blur-sm overflow-y-auto">
                        <div class="text-center md:text-left mb-8">
                            <h2 class="text-3xl font-bold text-slate-800">System Access</h2>
                            <p class="text-slate-500 font-medium">Select your interface protocol.</p>
                        </div>

                        <!-- Card Tabs -->
                        <div class="space-y-6">
                            <!-- Student Login Card -->
                            <div class="bg-white/80 p-6 rounded-xl shadow-lg border border-indigo-100 hover:border-indigo-400 transition-all group backdrop-blur-sm">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="p-2 bg-indigo-50 text-indigo-600 rounded-md"><i class="ph-bold ph-student text-xl"></i></div>
                                    <h3 class="font-bold text-slate-700">Student Portal</h3>
                                </div>
                                <form id="student-login-form">
                                    <input type="text" id="login-usn" placeholder="USN (e.g. 2GI23CS001)" class="fun-input w-full mb-3 uppercase" required>
                                    <button type="submit" class="btn-bouncy w-full bg-slate-900 text-white font-mono py-3 rounded-lg shadow-lg hover:bg-black border border-slate-700 flex justify-center items-center gap-2">
                                        <i class="ph-bold ph-arrow-right"></i> Initialize Session
                                    </button>
                                </form>
                            </div>

                            <!-- Admin Login Card -->
                            <div class="bg-white/80 p-6 rounded-xl shadow-lg border border-slate-200 hover:border-slate-400 transition-all group backdrop-blur-sm">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="p-2 bg-slate-100 text-slate-600 rounded-md"><i class="ph-bold ph-shield-check text-xl"></i></div>
                                    <h3 class="font-bold text-slate-700">Root Access</h3>
                                </div>
                                <form id="admin-login-form">

                            <i class="ph-bold ph-copy"></i> Copy JSON Payload
                        </button>
                    </div>
                </div>
            </div>`;
        }

        // New Modal for Editing Profile
        function renderProfileModal() {
            const s = state.loggedInUser;
            return `
             <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" id="close-profile-modal"></div>
                <div class="glass relative z-10 w-full max-w-md rounded-xl p-6 bg-white shadow-2xl">
                     <h3 class="font-bold text-xl text-slate-800 font-mono mb-4">Config Profile</h3>
                     <form id="profile-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 font-mono">GITHUB URL</label>
                            <input id="p-github" value="${s.github || ''}" placeholder="https://github.com/..." class="fun-input w-full">
                        </div>
                        <div>
                             <label class="block text-xs font-bold text-slate-500 mb-1 font-mono">LINKEDIN URL</label>
                            <input id="p-linkedin" value="${s.linkedin || ''}" placeholder="https://linkedin.com/in/..." class="fun-input w-full">
                        </div>
                        <div class="flex gap-2 pt-2">
                             <button type="button" id="cancel-profile-btn" class="w-1/2 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-100 font-mono">Cancel</button>
                             <button type="submit" class="w-1/2 bg-slate-900 text-white py-2 rounded-lg font-bold hover:bg-black font-mono">Save Config</button>
                        </div>
                     </form>
                </div>
             </div>
            `;
        }

        function attachEventListeners() {
            const el = (id) => document.getElementById(id);

            // Login
            if (el('admin-login-form')) el('admin-login-form').onsubmit = (e) => {
                e.preventDefault();
                loginAsAdmin(el('admin-email').value);
            };
            if (el('student-login-form')) el('student-login-form').onsubmit = (e) => { e.preventDefault(); loginAsStudent(el('login-usn').value); };

            // Nav & Actions
            if (el('signout-btn')) el('signout-btn').onclick = handleSignOut;
            if (el('student-signout-btn')) el('student-signout-btn').onclick = handleSignOut;
            if (el('back-admin-btn')) el('back-admin-btn').onclick = loginAsAdmin;

            if (el('upload-data-btn')) el('upload-data-btn').onclick = () => handleFileUpload(el('csv-file-input').files[0]);
            if (el('csv-file-input')) el('csv-file-input').onchange = () => handleFileUpload(el('csv-file-input').files[0]);

            if (el('company-form')) el('company-form').onsubmit = (e) => {
                e.preventDefault();
                handleSaveCompany(el('c-name').value, el('c-cgpa').value, el('c-skills').value);
                e.target.reset();
            };

            if (el('del-all-btn')) el('del-all-btn').onclick = handleDeleteAllStudents;
            if (el('gen-ai-btn')) el('gen-ai-btn').onclick = generateRecommendation;

            // Dynamic Buttons
            document.querySelectorAll('.delete-student-btn').forEach(b => b.onclick = (e) => handleDeleteItem(COLLECTION_STUDENTS, e.currentTarget.dataset.usn));
            document.querySelectorAll('.delete-company-btn').forEach(b => b.onclick = (e) => handleDeleteItem(COLLECTION_COMPANIES, e.currentTarget.dataset.id));
            document.querySelectorAll('.view-student-btn').forEach(b => b.onclick = (e) => viewAsStudent(e.currentTarget.dataset.usn));

            document.querySelectorAll('.check-matches-btn').forEach(b => b.onclick = (e) => {
                const c = state.companyRequirements.find(x => x.id === e.currentTarget.dataset.id);
                updateState({ showMatchModal: true, selectedCompanyMatches: findEligibleStudents(c, state.studentData), selectedCompanyName: c.name });
            });

            // Apply Button Logic
            document.querySelectorAll('.apply-btn').forEach(b => b.onclick = (e) => {
                handleApplyToCompany(e.currentTarget.dataset.id, e.currentTarget.dataset.name);
            });

            // Profile Editing Logic
            if (el('edit-profile-btn')) el('edit-profile-btn').onclick = () => updateState({ showProfileModal: true });
            if (el('close-profile-modal')) el('close-profile-modal').onclick = () => updateState({ showProfileModal: false });
            if (el('cancel-profile-btn')) el('cancel-profile-btn').onclick = () => updateState({ showProfileModal: false });
            if (el('profile-form')) el('profile-form').onsubmit = (e) => {
                e.preventDefault();
                handleUpdateProfile(el('p-github').value, el('p-linkedin').value);
            };


            if (el('close-modal')) el('close-modal').onclick = () => updateState({ showMatchModal: false });
            if (el('close-modal-btn')) el('close-modal-btn').onclick = () => updateState({ showMatchModal: false });
            if (el('copy-rpa')) el('copy-rpa').onclick = () => {
                navigator.clipboard.writeText(JSON.stringify(state.selectedCompanyMatches, null, 2));
                updateState({ message: 'JSON Copied to Clipboard' });
            };
        }

        initializeAndAuthenticate();
    </script>
</body>

</html>
